name: Publish textbook cover

on:
  push:
    branches: [main]
    paths:
      - index.html
      - changelog.md
      - public/cover-assets/**
      - scripts/build-cover.mjs
      - tests/cover.test.mjs
      - .github/workflows/publish-cover.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Test changelog and cover generation
        run: npm run cover:test
      - name: Build cover from changelog
        env:
          MEMBER_ORIGIN: https://codex-mochi.mochilabo.workers.dev
        run: npm run cover:build
      - name: Upload cover artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: cover-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
